[project]
name = "takt-phase0"
version = "0.1.0"
description = "Data check for Takt: realtime coverage of the open DELFI feed in Leipzig"
requires-python = ">=3.12"
dependencies = ["gtfs-realtime-bindings>=1.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "DTZ", "PL", "ANN", "RUF", "D",
]
ignore = [
    "D203", "D213",   # docstring layout: one of each pair
    "PLR2004",        # GTFS enum values (route types, relationships) read better as numbers with a comment
]
